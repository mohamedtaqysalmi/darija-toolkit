name: Bug report
description: Something produces wrong output or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the input text and the output you got.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal snippet or command is best.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: darija-toolkit version
  - type: input
    id: python
    attributes:
      label: Python version and OS
